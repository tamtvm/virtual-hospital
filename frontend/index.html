    <link rel="stylesheet" href="/css/style.css">

    <script>
        document.documentElement.dataset.mlvhRoute =
            location.pathname.replace(/\/+$/, '') || '/';
    </script>

    <script src="/js/locale-boot.js"></script>
</head>
<body class="text-dark">

    <script>
        if (document.documentElement.dataset.mlvhRoute === '/') {
            document.body.classList.add('mlvh-entry-screen');
        }
    </script>

    <a class="mlvh-skip-link" href="#main-content" data-i18n="shell.skipToContent">Skip to main content</a>

    <header class="mlvh-header">
        <button class="mlvh-sidebar-toggle mlvh-sidebar-toggle-open" id="sidebar-toggle" aria-label="Toggle navigation" data-i18n-aria-label="shell.toggleNavigation" aria-controls="mlvh-sidebar" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a class="mlvh-sidebar-toggle mlvh-sidebar-toggle-close" href="/" id="sidebar-close" aria-label="Back to entry screen" data-i18n-aria-label="shell.backToEntry">
            <img src="/assets/icons/misc/close.svg" alt="">
        </a>
    </header>

    <nav class="mlvh-dock" aria-label="History" data-i18n-aria-label="shell.history">
        <button class="mlvh-dock-btn" id="nav-back" aria-label="Go back" data-i18n-aria-label="shell.goBack">
            <img src="/assets/icons/misc/back.svg" alt="">
        </button>
        <button type="button" class="mlvh-dock-badge" aria-hidden="true" tabindex="-1">
            <img src="/assets/brand/star.svg" alt="">
        </button>
        <button class="mlvh-dock-btn mlvh-dock-btn-forward" id="nav-forward" aria-label="Go forward" data-i18n-aria-label="shell.goForward" disabled>
            <img src="/assets/icons/misc/back.svg" alt="">
        </button>
    </nav>

    <div class="mlvh-app-shell">
        <div class="mlvh-sidebar-backdrop" id="sidebar-backdrop"></div>

        <!-- Sidebar -->
        <aside class="mlvh-sidebar" id="mlvh-sidebar">
            <a class="mlvh-sidebar-brand" href="/home" id="nav-home">
                <img src="/assets/brand/mlvh.svg" alt="MLVH">
            </a>

            <nav class="mlvh-sidebar-nav">
                <a class="mlvh-sidebar-link" href="/home" id="nav-home-link">
                    <img src="/assets/icons/nav/home.svg" alt="">
                    <span data-i18n="nav.home">Home</span>
                </a>
                <a class="mlvh-sidebar-link" href="/patients" id="nav-patients">
                    <img src="/assets/icons/nav/patients.svg" alt="">
                    <span data-i18n="nav.patients">Patient Admin</span>
                </a>
                <a class="mlvh-sidebar-link" href="/medical-records" id="nav-medical-records">
                    <img src="/assets/icons/nav/consultations.svg" alt="">
                    <span data-i18n="nav.medicalRecords">Medical Records</span>
                </a>
                <a class="mlvh-sidebar-link" href="/dashboard/">
                    <img src="/assets/icons/nav/dashboard.svg" alt="">
                    <span data-i18n="nav.dashboard">Dashboard</span>
                </a>
                <a class="mlvh-sidebar-link" href="/settings" id="nav-settings">
                    <img src="/assets/icons/nav/settings.svg" alt="">
                    <span data-i18n="nav.settings">Settings</span>
                </a>
            </nav>
        </aside>

        <main class="mlvh-main" id="main-content" tabindex="-1">
            <h1 class="mlvh-page-title">
                <span class="mlvh-visually-hidden" id="page-heading"></span>
            </h1>
            <div id="app-root"></div>
        </main>
    </div>

    <!-- Modal Container Global -->
    <div id="modal-root">
    </div>

    <!-- Bootstrap 5 JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.26.25/sweetalert2.all.min.js"></script>

    <!-- Custom JS App -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
