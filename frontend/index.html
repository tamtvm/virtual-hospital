<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Little Virtual Hospital</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">

    <script>
        document.documentElement.dataset.mlvhRoute =
            location.pathname.replace(/\/+$/, '') || '/';
    </script>
</head>
<body class="text-dark">

    <header class="mlvh-header">
        <button class="mlvh-sidebar-toggle mlvh-sidebar-toggle-open" id="sidebar-toggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="mlvh-header-nav">
            <button class="mlvh-header-nav-btn" id="nav-back" aria-label="Go back">
                <img src="/assets/icons/misc/back.svg" alt="">
            </button>
            <button class="mlvh-header-nav-btn mlvh-header-nav-btn-forward" id="nav-forward" aria-label="Go forward" disabled>
                <img src="/assets/icons/misc/back.svg" alt="">
            </button>
        </div>
        <button class="mlvh-sidebar-toggle mlvh-sidebar-toggle-close" id="sidebar-close" aria-label="Close navigation">
            <img src="/assets/icons/misc/close.svg" alt="">
        </button>
    </header>

    <div class="mlvh-app-shell">
        <div class="mlvh-sidebar-backdrop" id="sidebar-backdrop"></div>

        <!-- Sidebar -->
        <aside class="mlvh-sidebar">
            <a class="mlvh-sidebar-brand" href="/home/" id="nav-home">
                <img src="/assets/brand/mlvh.svg" alt="MLVH">
            </a>

            <nav class="mlvh-sidebar-nav">
                <a class="mlvh-sidebar-link" href="/home/" id="nav-home-link">
                    <img src="/assets/icons/nav/home.svg" alt="">
                    <span>Home</span>
                </a>
                <a class="mlvh-sidebar-link" href="/dashboard/">
                    <img src="/assets/icons/nav/dashboard.svg" alt="">
                    <span>Dashboard</span>
                </a>
                <a class="mlvh-sidebar-link" href="/patients/" id="nav-patients">
                    <img src="/assets/icons/nav/patients.svg" alt="">
                    <span>Patient Admin</span>
                </a>
                <a class="mlvh-sidebar-link" href="/medical-records/" id="nav-medical-records">
                    <img src="/assets/icons/nav/consultations.svg" alt="">
                    <span>Medical Records</span>
                </a>
            </nav>
        </aside>

        <main class="mlvh-main">
            <h1 class="mlvh-page-title">
                <!-- <img src="/assets/brand/title.svg" alt="My Little Virtual Hospital"> -->
            </h1>
            <div id="app-root"></div>
        </main>
    </div>

    <!-- Modal Container Global -->
    <div id="modal-root">
    </div>

    <!-- Bootstrap 5 JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.26.25/sweetalert2.all.min.js"></script>

    <!-- Custom JS App -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
