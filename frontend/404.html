<!DOCTYPE html>
<html lang="en">
<head>

    <!-- --- Favicons --- -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Bootstrap 5 CSS -->

    <div class="mlvh-card mlvh-404-card">

            <span class="mlvh-card-tag">404</span>
        </div>
        <div class="mlvh-card-body text-center">
            <h2 data-i18n="notFound.title">404. Not Found</h2>
            <p class="mlvh-card-subtitle" data-i18n="notFound.message">This page does not exist in our hospital.</p>
            <a href="/home" class="btn btn-primary" data-i18n="notFound.back">Back to the Hospital</a>
        </div>
    </div>

    <script type="module">
        import { initI18n, t } from '/js/i18n.js';
        import { brandTitle } from '/js/constants/brand.js';
